<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tide Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Galveston Pier 21</h1>
            <p class="subtitle">Station 8771450 • Today</p>
        </header>

        <div class="card">
            <!-- Graph on Top -->
            <div class="legend">
                <span class="legend-item"><span class="dot obs"></span> Observed</span>
                <span class="legend-item"><span class="dot pred"></span> Predicted</span>
            </div>
            
            <div id="chart-container" class="chart-container">
                <div class="loader"></div>
            </div>

            <hr class="divider">

            <!-- Next 2 Tides on Bottom -->
            <div id="tide-display"></div>
        </div>

        <footer>
            <p>NOAA Tides & Currents API</p>
        </footer>
    </div>

    <script src="scripts.js"></script>
</body>
</html>

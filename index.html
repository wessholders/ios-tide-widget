<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tide Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        
        <div id="map"></div>

        <header>
            <h1 id="station-name">Galveston Pier 21</h1>
            <p class="subtitle">Observed vs. Predicted (MLLW)</p>
        </header>

        <div class="card">
            <div class="legend">
                <span class="legend-item"><span class="dot obs"></span> Observed</span>
                <span class="legend-item"><span class="dot pred"></span> Predicted</span>
            </div>

            <div id="chart-container" class="chart-container">
                <div class="loader"></div>
            </div>

            <div id="tide-display"></div>
        </div>

        <footer>
            <p>NOAA Tides & Currents API</p>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="scripts.js"></script>
</body>
</html>
